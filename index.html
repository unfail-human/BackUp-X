<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BackUp-X</title><meta name="description" content="내 X 계정의 트윗을 이미지와 티스토리용 서식으로 백업하세요."><meta property="og:type" content="website"><meta property="og:site_name" content="BackUp-X"><meta property="og:title" content="BackUp-X — X Archive Studio"><meta property="og:description" content="내가 남긴 타래를 온전한 기록으로."><meta property="og:url" content="https://unfail-human.github.io/BackUp-X/"><meta property="og:image" content="https://unfail-human.github.io/BackUp-X/og-image.png"><meta name="twitter:card" content="summary_large_image"><meta name="twitter:title" content="BackUp-X — X Archive Studio"><meta name="twitter:image" content="https://unfail-human.github.io/BackUp-X/og-image.png"><link rel="icon" type="image/png" href="./favicon.png"><link rel="apple-touch-icon" href="./favicon.png"><link rel="stylesheet" href="style.css"></head><body><header><b>▣ BackUp-X</b><span>내 계정 전용 백업 스튜디오</span></header><main><section class="hero"><small>MY X ARCHIVE STUDIO</small><h1>내가 남긴 타래를,<br><em>온전한 기록으로.</em></h1><p>내 트윗을 편집해 이미지로 저장하거나 티스토리용 서식으로 복사하세요.</p></section><section class="app"><aside><h3>01 · 내 트윗 가져오기</h3><label>내 트윗 링크</label><input id="url" placeholder="https://x.com/my_id/status/…"><button id="load">내 타래 불러오기</button><p id="status">예시 타래를 편집해 볼 수 있어요.</p><hr><h3>02 · 이미지 편집</h3><label>프로필 사진<input id="avatarFile" type="file" accept="image/*"></label><label>폰트<select id="font"><option value="Pretendard">Pretendard</option><option value="Noto Sans KR">Noto Sans KR</option><option value="KoPub Dotum">KoPubWorld 돋움</option><option value="KoPub Batang">KoPubWorld 바탕</option></select></label><div class="colors"><label>배경색<input id="bg" type="color" value="#f5f2ea"></label><label>카드색<input id="card" type="color" value="#ffffff"></label></div><label>글자 크기 <input id="size" type="range" min="12" max="24" value="16"></label><label><input id="profile" type="checkbox" checked> 프로필 정보 표시</label><label><input id="date" type="checkbox" checked> 날짜와 시간 표시</label><label><input id="link" type="checkbox" checked> 원문 링크 표시</label></aside><section class="editor"><nav><button data-tab="text" class="on">텍스트 편집</button><button data-tab="image">이미지 미리보기</button></nav><div id="textView"></div><div id="imageView" hidden><canvas id="canvas"></canvas></div><footer><button id="html">HTML 복사</button><button id="rich">서식 복사</button><button id="png" hidden>PNG 저장</button></footer></section></section></main><script src="app.js"></script></body></html>
