<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BackUp-X</title>
<meta name="description" content="내 X 계정의 트윗을 이미지와 티스토리용 서식으로 백업하세요.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="BackUp-X">
<meta property="og:title" content="BackUp-X — X Archive Studio">
<meta property="og:description" content="내가 남긴 타래를 온전한 기록으로.">
<meta property="og:url" content="https://unfail-human.github.io/BackUp-X/">
<meta property="og:image" content="https://unfail-human.github.io/BackUp-X/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="BackUp-X — X Archive Studio">
<meta name="twitter:image" content="https://unfail-human.github.io/BackUp-X/og-image.png">
<link rel="icon" type="image/png" href="./favicon.png">
<link rel="apple-touch-icon" href="./favicon.png">
<link rel="stylesheet" href="style.css?v=25">
</head>
<body>
<header>
<b><i class="brand-sparkle" aria-hidden="true"></i>BackUp-X</b>
<div class="header-state">
<span id="saveState">
<i>
</i> 자동 저장 준비</span>
<span>내 계정 전용 백업 스튜디오</span>
</div>
</header>
<main>
<section class="app">
<aside>
<h3>01 · 내 타래 가져오기</h3>
<label>첫 트윗 링크</label>
<input id="url" placeholder="https://x.com/my_id/status/…">
<button id="load" disabled>트윗 불러오기</button>
<div id="status" class="import-status" aria-live="polite" hidden>
<i>
</i>
<span>
</span>
<b>
</b>
</div>
<p class="archive-help">공개 트윗만 가져올 수 있어요. 누락된 트윗은 게시글 오른쪽의 + 버튼으로 추가하세요.</p>
<hr>
<h3>02 · 이미지 편집</h3>
<label>폰트<select id="font">
<option value="Pretendard">Pretendard</option>
<option value="Noto Sans KR">Noto Sans KR</option>
<optgroup label="KoPubWorld 돋움">
<option value="KoPub Dotum Light">KoPubWorld 돋움 Light</option>
<option value="KoPub Dotum Medium">KoPubWorld 돋움 Medium</option>
<option value="KoPub Dotum Bold">KoPubWorld 돋움 Bold</option>
</optgroup>
<optgroup label="KoPubWorld 바탕">
<option value="KoPub Batang Light">KoPubWorld 바탕 Light</option>
<option value="KoPub Batang Medium">KoPubWorld 바탕 Medium</option>
<option value="KoPub Batang Bold">KoPubWorld 바탕 Bold</option>
</optgroup>
<optgroup label="기본 폰트">
<option value="system-ui">시스템 기본</option>
<option value="Apple SD Gothic Neo">Apple SD Gothic Neo</option>
<option value="Malgun Gothic">맑은 고딕</option>
<option value="Arial">Arial</option>
<option value="Georgia">Georgia</option>
</optgroup>
</select>
</label>
<label>게시글 글자 크기 <span id="textSizeValue">15px</span><input id="textSize" type="range" min="12" max="22" value="15">
</label>
<div class="theme-row">
<label>메인 테마색<input id="mainColor" type="color" value="#9b8f7f">
</label>
<label class="auto-palette"><span><b>자동 추천 팔레트</b><small>메인 색상에 맞춰 배경·카드색을 자동 조정</small></span><input id="recommendColors" type="checkbox" checked></label>
</div>
<div class="colors">
<label>배경색<input id="bg" type="color" value="#d2c7b8">
</label>
<label>카드색<input id="card" type="color" value="#e8dfd3">
</label>
</div>
<button id="resetColors" class="reset-colors" type="button">색상 초기화</button>
<label>배경 방식<select id="bgMode"><option value="solid">단색</option><option value="gradient">그라데이션</option><option value="image">이미지</option></select>
</label>
<section id="gradientPanel" class="gradient-panel" hidden>
<div class="gradient-preview" id="gradientPreview"></div>
<div class="gradient-colors">
<label>시작 색상<input id="gradientStart" type="color" value="#d2c7b8"></label>
<label>끝 색상<input id="bg2" type="color" value="#b8a895"></label>
</div>
<label class="gradient-angle"><span>그라데이션 방향 <b id="gradientAngleValue">135°</b></span><input id="gradientAngle" type="range" min="0" max="360" value="135"></label>
</section>
<label id="backgroundImageField" hidden>배경 이미지<input id="backgroundFile" type="file" accept="image/*">
</label>
<button id="clearBackground" class="reset-colors" type="button" hidden>배경 이미지 삭제</button>
</aside>
<section class="editor">
<nav>
<button data-tab="text" class="on">게시글 편집</button>
<button data-tab="image">이미지 미리보기</button>
<button id="rich" class="copy-rich">서식 복사</button>
</nav>
<div id="textView">
</div>
<div id="imageView" hidden>
<canvas id="canvas">
</canvas>
</div>
<footer hidden>
<button id="png" hidden>PNG 저장</button>
</footer>
</section>
</section>
</main>
<div class="notice-backdrop" id="noticeBackdrop" hidden>
<section class="notice-modal" role="dialog" aria-modal="true" aria-labelledby="noticeTitle">
<div class="notice-kicker">BACKUP-X UPDATE</div>
<h2 id="noticeTitle">업데이트되었습니다.</h2>
<div class="notice-content">
BackUp-X의 기능과 화면이 새롭게 업데이트되었습니다.
</div>
<label class="notice-check">
<input type="checkbox" id="noticeDismiss"> 이 버전의 공지 다시 보지 않기</label>
<button id="noticeClose" type="button">확인</button>
</section>
</div>
<script src="app.js?v=25">
</script>
</body>
</html>
